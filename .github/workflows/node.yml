name: Node
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts
      - run: node --version
      - run: node mod.ts
      - name: Commit files
        run: |
          git config --local user.email "695601626@qq.com"
          git config --local user.name "linbingquan"
          git add .
          git commit -m "feat(deploy): workflow action for deploy" || echo "no changes to commit"
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
